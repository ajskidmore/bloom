<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bloom · wellness tracker</title>
  <meta name="theme-color" content="#f6f1e7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
  <script>
    /* Start-up safety net: if Bloom can't start (an error, or an old cached page on a phone),
       show what happened and a Reload button instead of a blank screen. */
    (function () {
      var shown = false, errs = [];
      function fresh() {
        var u = new URL(location.href);
        u.searchParams.set('r', Date.now().toString(36));
        location.replace(u.toString());
      }
      function show(msg) {
        if (shown) return; shown = true;
        var box = document.createElement('div');
        box.className = 'boot-fail';
        box.innerHTML = '<h2>Bloom didn’t start</h2><p>Tap Reload to load the latest version. If this keeps happening, send a screenshot of this screen.</p><pre></pre><button type="button" class="btn primary big">Reload</button>';
        box.querySelector('pre').textContent = msg || 'No error was reported.';
        box.querySelector('button').onclick = fresh;
        (document.body || document.documentElement).appendChild(box);
      }
      window.__bloomBootFail = show;
      window.__bloomReloadFresh = fresh;
      window.addEventListener('error', function (e) { errs.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); if (!window.__bloomStarted) show(errs.join('\n')); });
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; errs.push('Unhandled: ' + (r && (r.message || r.code) || r)); if (!window.__bloomStarted) show(errs.join('\n')); });
      setTimeout(function () { if (!window.__bloomStarted) show(errs.join('\n') || 'Bloom took too long to start. Check your connection, then reload.'); }, 20000);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#content">Skip to main content</a>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#today" aria-label="Bloom, go to Today"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3f9a5a"/><g transform="translate(16 16)" fill="#fffdf8"><ellipse cy="-5.6" rx="3.9" ry="5.6"/><ellipse cy="-5.6" rx="3.9" ry="5.6" transform="rotate(90)"/><ellipse cy="-5.6" rx="3.9" ry="5.6" transform="rotate(180)"/><ellipse cy="-5.6" rx="3.9" ry="5.6" transform="rotate(270)"/></g><circle cx="16" cy="16" r="2.6" fill="#3f9a5a"/></svg>Bloom</a>
      <nav class="tabs" id="tabbar" aria-label="Main sections" hidden>
        <a href="#today" data-tab="today"><svg class="ico " width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg><b>Today</b></a>
        <a href="#food" data-tab="food"><svg class="ico " width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg><b>Food</b></a>
        <a href="#health" data-tab="health"><svg class="ico " width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg><b>Health</b></a>
        <a href="#trends" data-tab="trends"><svg class="ico " width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg><b>Trends</b></a>
        <a href="#feed" data-tab="feed"><svg class="ico " width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg><b>Feed</b></a>
        <a href="#settings" data-tab="settings"><svg class="ico " width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><b>Settings</b></a>
      </nav>
      <div class="top-right">
        <a href="#today" class="mini" id="miniLink" aria-label="Your flower"><svg id="miniFlower" viewBox="0 0 200 260" aria-hidden="true"></svg><span id="miniPct" aria-hidden="true"></span></a>
        <button id="bellBtn" class="bell-btn" aria-label="Notifications" hidden><svg class="ico " width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="bellBadge" class="bell-badge" hidden></span></button>
        <div id="userArea" class="user-area"></div>
      </div>
    </header>

    <main id="content" tabindex="-1">
    <h1 class="sr-only page-title" id="pageTitle" tabindex="-1">Bloom</h1>
    <div id="banner" class="banner" role="status" hidden>
      <span id="bannerText"></span>
      <span id="bannerActions" class="banner-actions"></span>
      <button class="icon-btn" id="bannerClose" aria-label="Dismiss message"><svg class="ico " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>

    <section id="auth" class="auth card" aria-labelledby="authTitle" hidden></section>

    <div id="main" hidden>
      <div class="date-nav" id="dateNav" role="group" aria-label="Date">
        <button class="icon-btn" id="datePrev" aria-label="Previous day"><svg class="ico " width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="date-label" id="dateLabel" aria-describedby="dateHint"></button><span id="dateHint" class="sr-only">Opens a date picker</span>
        <input type="date" id="dateInput" class="date-input" aria-label="Pick a date" tabindex="-1" />
        <button class="icon-btn" id="dateNext" aria-label="Next day"><svg class="ico " width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg></button>
        <button class="btn small ghost" id="dateToday" hidden>Today</button>
      </div>

      <!-- TODAY -->
      <div id="tab-today">
        <section class="garden card" aria-label="Your flower">
          <div class="flower-wrap" id="flowerWrap">
            <svg id="flower" viewBox="0 0 200 260" role="img" aria-label="Your flower"></svg>
            <div id="drops" class="drops" aria-hidden="true"></div>
          </div>
          <div class="garden-info">
            <div class="bubble" id="bubble" aria-live="polite">Hi! Water me by checking things off.</div>
            <input id="flowerName" class="flower-name" maxlength="20" aria-label="Flower name" />
            <div class="meter" aria-hidden="true"><div id="meterFill"></div></div>
            <div class="meter-label"><span id="stage">—</span><span id="pct">—</span></div>
          </div>
        </section>
        <div class="list-head"><h2>Your routine</h2><button id="addBtn" class="btn primary"><svg class="ico " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add habit</button></div>
        <div id="sections"></div>
      </div>

      <div id="tab-food" hidden><div id="foodView"></div></div>
      <div id="tab-health" hidden><div id="healthView"></div></div>
      <div id="tab-trends" hidden><div id="trendsView"></div></div>
      <div id="tab-friends" hidden><div id="friendsView"></div></div>
      <div id="tab-settings" hidden><div id="settingsView"></div></div>
    </div>

    <button id="fab" class="fab" aria-label="Log a meal"><svg class="ico " width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
    </main>
  </div>

  <script type="module" src="js/app.js?v=10"></script>
</body>
</html>
