<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bloom · wellness tracker</title>
  <meta name="theme-color" content="#f6f1e7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
  <script>
    /* Start-up safety net: if Bloom can't start (an error, or an old cached page on a phone),
       show what happened and a Reload button instead of a blank screen. */
    (function () {
      var shown = false, errs = [];
      function fresh() {
        var u = new URL(location.href);
        u.searchParams.set('r', Date.now().toString(36));
        location.replace(u.toString());
      }
      function show(msg) {
        if (shown) return; shown = true;
        var box = document.createElement('div');
        box.className = 'boot-fail';
        box.innerHTML = '<h2>Bloom didn’t start</h2><p>Tap Reload to load the latest version. If this keeps happening, send a screenshot of this screen.</p><pre></pre><button type="button" class="btn primary big">Reload</button>';
        box.querySelector('pre').textContent = msg || 'No error was reported.';
        box.querySelector('button').onclick = fresh;
        (document.body || document.documentElement).appendChild(box);
      }
      window.__bloomBootFail = show;
      window.__bloomReloadFresh = fresh;
      window.addEventListener('error', function (e) { errs.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); if (!window.__bloomStarted) show(errs.join('\n')); });
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; errs.push('Unhandled: ' + (r && (r.message || r.code) || r)); if (!window.__bloomStarted) show(errs.join('\n')); });
      setTimeout(function () { if (!window.__bloomStarted) show(errs.join('\n') || 'Bloom took too long to start. Check your connection, then reload.'); }, 20000);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#today"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3f9a5a"/><g transform="translate(16 16)" fill="#fffdf8"><ellipse cy="-5.6" rx="3.9" ry="5.6"/><ellipse cy="-5.6" rx="3.9" ry="5.6" transform="rotate(90)"/><ellipse cy="-5.6" rx="3.9" ry="5.6" transform="rotate(180)"/><ellipse cy="-5.6" rx="3.9" ry="5.6" transform="rotate(270)"/></g><circle cx="16" cy="16" r="2.6" fill="#3f9a5a"/></svg>Bloom</a>
      <nav class="tabs" id="tabbar" hidden>
        <a href="#today" data-tab="today"><span>🌱</span><b>Today</b></a>
        <a href="#food" data-tab="food"><span>🍽️</span><b>Food</b></a>
        <a href="#health" data-tab="health"><span>❤️</span><b>Health</b></a>
        <a href="#trends" data-tab="trends"><span>📈</span><b>Trends</b></a>
        <a href="#feed" data-tab="feed"><span>👟</span><b>Feed</b></a>
        <a href="#settings" data-tab="settings"><span>⚙️</span><b>Settings</b></a>
      </nav>
      <div class="top-right">
        <a href="#today" class="mini" title="Your flower"><svg id="miniFlower" viewBox="0 0 200 260" aria-hidden="true"></svg><span id="miniPct"></span></a>
        <button id="bellBtn" class="bell-btn" aria-label="Notifications" hidden><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.4l-1.6 2.9A1 1 0 0 0 5.3 17h13.4a1 1 0 0 0 .9-1.7L18 12.4V9a6 6 0 0 0-6-6zm0 19a2.6 2.6 0 0 0 2.5-2h-5A2.6 2.6 0 0 0 12 22z" fill="currentColor"/></svg><span id="bellBadge" class="bell-badge" hidden></span></button>
        <div id="userArea" class="user-area"></div>
      </div>
    </header>

    <div id="banner" class="banner" hidden>
      <span id="bannerText"></span>
      <button class="icon-btn" id="bannerClose" aria-label="Dismiss">✕</button>
    </div>

    <section id="auth" class="auth card" hidden></section>

    <main id="main" hidden>
      <div class="date-nav" id="dateNav">
        <button class="icon-btn" id="datePrev" aria-label="Previous day">‹</button>
        <button class="date-label" id="dateLabel"></button>
        <input type="date" id="dateInput" class="date-input" aria-label="Pick a date" />
        <button class="icon-btn" id="dateNext" aria-label="Next day">›</button>
        <button class="btn small ghost" id="dateToday" hidden>Today</button>
      </div>

      <!-- TODAY -->
      <div id="tab-today">
        <section class="garden card">
          <div class="flower-wrap" id="flowerWrap">
            <svg id="flower" viewBox="0 0 200 260" role="img" aria-label="Your flower"></svg>
            <div id="drops" class="drops" aria-hidden="true"></div>
          </div>
          <div class="garden-info">
            <div class="bubble" id="bubble">Hi! Water me by checking things off.</div>
            <input id="flowerName" class="flower-name" maxlength="20" aria-label="Flower name" />
            <div class="meter"><div id="meterFill"></div></div>
            <div class="meter-label"><span id="stage">—</span><span id="pct">—</span></div>
          </div>
        </section>
        <div class="list-head"><h2>Your routine</h2><button id="addBtn" class="btn primary">+ Add habit</button></div>
        <div id="sections"></div>
      </div>

      <div id="tab-food" hidden><div id="foodView"></div></div>
      <div id="tab-health" hidden><div id="healthView"></div></div>
      <div id="tab-trends" hidden><div id="trendsView"></div></div>
      <div id="tab-friends" hidden><div id="friendsView"></div></div>
      <div id="tab-settings" hidden><div id="settingsView"></div></div>
    </main>

    <button id="fab" class="fab" aria-label="Log a meal" title="Log a meal">📷</button>
  </div>

  <script type="module" src="js/app.js?v=8"></script>
</body>
</html>
